<VirtualHost *:10000>
    ServerName localhost
    DocumentRoot /var/www/alesnad/public

    <Directory /var/www/alesnad/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
